name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot Android export environment
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/"
          if [ -f /root/.config/godot/editor_settings-4.7.tres ]; then
            cp /root/.config/godot/editor_settings-4.7.tres "$HOME/.config/godot/"
          fi
          test -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.2"

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: mkdir -p build && godot --headless --path . --export-debug "Android" build/DAYS_AFTER.apk

      - name: Verify APK
        run: test -s build/DAYS_AFTER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAYS-AFTER-Android
          path: build/DAYS_AFTER.apk
          if-no-files-found: error
