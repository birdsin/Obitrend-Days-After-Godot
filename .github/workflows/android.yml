name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: mkdir -p build && godot --headless --path . --export-release "Android" build/DAYS_AFTER.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAYS-AFTER-Android
          path: build/DAYS_AFTER.apk
          if-no-files-found: error
